<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogstah Profile</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            color: white;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startApp()">
        <h1>CLICK TO ENTER</h1>
    </div>

    <video loop playsinline id="bg-video">
        <source src="https://r2.guns.lol/e0098194-124f-4040-a7f9-b561658377dd.mp4" type="video/mp4">
    </video>

    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/jmsvsz.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="content-box">
            <h1>ROGSTAHT</h1>
            <p>Developer from Sweden</p>
        </div>
    </div>

    <script>
        function startApp() {
            const video = document.getElementById('bg-video');
            const music = document.getElementById('bg-music');
            const overlay = document.getElementById('overlay');

            video.play();
            music.play();
            
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        }
    </script>

</body>
</html>
