<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogstah</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dim: rgba(255,255,255,0.5);
            --dimmer: rgba(255,255,255,0.12);
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
        }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        #bg-video {
            position: fixed; inset: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.4s ease;
            filter: brightness(0.3) saturate(0.5);
        }
        #bg-video.visible { opacity: 1; }

        .vignette {
            position: fixed; inset: 0; z-index: 1;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }

        #particles {
            position: fixed; inset: 0; z-index: 2;
            pointer-events: none;
        }

        #overlay {
            position: fixed; inset: 0; z-index: 300;
            display: flex; align-items: center; justify-content: center;
            background: #000;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }

        .enter-btn {
            display: flex; align-items: center;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 13px 36px;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
        }
        #overlay:hover .enter-btn {
            border-color: rgba(255,255,255,0.4);
            color: white;
            background: rgba(255,255,255,0.05);
        }

        #main {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 1s ease 0.5s;
            pointer-events: none;
        }
        #main.visible { opacity: 1; pointer-events: all; }

        .card {
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            text-align: center; width: 300px;
        }

        .meta-row {
            display: flex; align-items: center; gap: 14px;
            font-size: 0.65rem; color: var(--dim);
            font-family: 'Space Mono', monospace; letter-spacing: 1px;
            opacity: 0; transform: translateY(6px);
            transition: all 0.6s ease 0.7s;
        }
        .meta-row.visible { opacity: 1; transform: translateY(0); }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        .meta-item svg { width: 10px; height: 10px; fill: var(--dim); }
        .vdiv { width: 1px; height: 12px; background: var(--dimmer); }

        .username {
            font-family: 'Space Mono', monospace;
            font-size: 1.9rem; font-weight: 700;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 50px rgba(255,255,255,0.25);
            opacity: 0; transform: translateY(10px);
            transition: all 0.7s ease 0.85s;
        }
        .username.visible { opacity: 1; transform: translateY(0); }

        .tagline {
            font-size: 0.7rem; color: var(--dim);
            letter-spacing: 2px; font-weight: 300;
            margin-top: -8px;
            opacity: 0; transition: opacity 0.6s ease 1.05s;
        }
        .tagline.visible { opacity: 1; }

        .socials {
            display: flex; gap: 8px;
            opacity: 0; transition: opacity 0.6s ease 1.2s;
        }
        .socials.visible { opacity: 1; }

        .soc {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--dim);
            text-decoration: none;
            transition: all 0.22s ease;
            backdrop-filter: blur(8px);
        }
        .soc:hover {
            border-color: rgba(255,255,255,0.28);
            color: white; background: rgba(255,255,255,0.07);
            transform: translateY(-2px);
        }

        .hr {
            width: 36px; height: 1px;
            background: var(--glass-border);
            opacity: 0; transition: opacity 0.6s ease 1.3s;
        }
        .hr.visible { opacity: 1; }

        .music-bar {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 11px 14px;
            backdrop-filter: blur(16px);
            display: flex; align-items: center; gap: 11px;
            opacity: 0; transform: translateY(6px);
            transition: all 0.6s ease 1.4s;
        }
        .music-bar.visible { opacity: 1; transform: translateY(0); }

        .thumb {
            width: 34px; height: 34px;
            border-radius: 7px;
            background: rgba(255,255,255,0.07);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }
        .thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 7px;
        }

        .minfo { flex: 1; min-width: 0; }

        .mtitle {
            font-size: 0.7rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }

        .mprog {
            display: flex; align-items: center; gap: 6px;
            margin-top: 6px;
        }

        .mtime {
            font-size: 0.58rem; color: var(--dim);
            font-family: 'Space Mono', monospace; flex-shrink: 0;
        }

        .track {
            flex: 1; height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden;
        }

        .fill {
            height: 100%; width: 0%;
            background: white; border-radius: 2px;
            transition: width 0.8s linear;
        }

        .mctrl {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }

        .cbtn {
            background: none; border: none;
            color: var(--dim); cursor: pointer;
            padding: 4px; display: flex;
            align-items: center; justify-content: center;
            transition: color 0.2s ease;
        }
        .cbtn:hover { color: white; }

        .cbtn.play {
            width: 27px; height: 27px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.04);
        }
        .cbtn.play:hover {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.35);
        }

        .mute-btn {
            position: fixed; top: 18px; left: 18px; z-index: 200;
            background: rgba(0,0,0,0.45);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            width: 34px; height: 34px;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; color: var(--dim);
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            font-size: 0.8rem;
        }
        .mute-btn:hover { color: white; border-color: rgba(255,255,255,0.22); }
        .mute-btn.show { display: flex; }
    </style>
</head>
<body>

<div id="overlay" onclick="startApp()">
    <div class="enter-btn">Enter</div>
</div>

<video id="bg-video" loop muted playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="vignette"></div>
<canvas id="particles"></canvas>

<audio id="bg-music" loop preload="none">
    <source src="https://files.catbox.moe/jmsvsz.mp3" type="audio/mpeg">
</audio>

<button class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊</button>

<div id="main">
    <div class="card">

        <div class="meta-row" id="meta-row">
            <span class="meta-item">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                <span id="view-count">...</span>
            </span>
            <div class="vdiv"></div>
            <span class="meta-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                Mirage
            </span>
        </div>

        <div class="username" id="username">ROGSTAH</div>
        <div class="tagline" id="tagline">Developer from Sweden</div>

        <div class="socials" id="socials">
            <a href="https://github.com/Rogstah" target="_blank" class="soc" title="GitHub">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            </a>
            <a href="https://discord.com/users/1393664646594039849" target="_blank" class="soc" title="Discord">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.079.11 18.1.132 18.114a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            </a>
            <a href="https://www.youtube.com/@Rogstah" target="_blank" class="soc" title="YouTube">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </a>
        </div>

        <div class="hr" id="hr"></div>

        <div class="music-bar" id="music-bar">
            <div class="thumb">
                <img src="cover.png" alt="cover" onerror="this.parentElement.innerHTML='♪'">
            </div>
            <div class="minfo">
                <div class="mtitle">Dark Thoughts</div>
                <div class="mprog">
                    <span class="mtime" id="tcur">0:00</span>
                    <div class="track"><div class="fill" id="fill"></div></div>
                    <span class="mtime" id="ttot">0:00</span>
                </div>
            </div>
            <div class="mctrl">
                <button class="cbtn" onclick="seekBack()">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button class="cbtn play" id="pbtn" onclick="togglePlay()">
                    <svg id="pico" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="cbtn" onclick="seekFwd()">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 4V8z"/></svg>
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    var started = false;
    var music = document.getElementById('bg-music');
    var muted = false;

    function fetchViews() {
        fetch('https://api.counterapi.dev/v1/rogstah/profile/up')
            .then(function(r){ return r.json(); })
            .then(function(d){
                var el = document.getElementById('view-count');
                if (el && d && d.count !== undefined) {
                    el.textContent = d.count.toLocaleString();
                }
            })
            .catch(function(){
                var el = document.getElementById('view-count');
                if (el) el.textContent = '—';
            });
    }

    function startApp() {
        if (started) return;
        started = true;

        var video = document.getElementById('bg-video');
        var overlay = document.getElementById('overlay');
        var main = document.getElementById('main');

        video.muted = true;
        video.load();
        video.play().catch(function(){});
        setTimeout(function(){ video.classList.add('visible'); }, 80);

        music.volume = 0.35;
        music.play().catch(function(){});

        overlay.classList.add('hidden');
        setTimeout(function(){ overlay.style.display = 'none'; }, 900);

        setTimeout(function(){
            main.classList.add('visible');
            ['meta-row','username','tagline','socials','hr','music-bar'].forEach(function(id){
                document.getElementById(id).classList.add('visible');
            });
            document.getElementById('mute-btn').classList.add('show');
        }, 300);

        initParticles();

        setInterval(function(){
            if (!music.duration) return;
            var p = (music.currentTime / music.duration) * 100;
            document.getElementById('fill').style.width = p + '%';
            document.getElementById('tcur').textContent = fmt(music.currentTime);
            document.getElementById('ttot').textContent = fmt(music.duration);
        }, 600);
    }

    function toggleMute() {
        muted = !muted;
        music.muted = muted;
        document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
    }

    function togglePlay() {
        if (music.paused) {
            music.play().catch(function(){});
            document.getElementById('pico').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else {
            music.pause();
            document.getElementById('pico').innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    }

    function seekBack() { music.currentTime = Math.max(0, music.currentTime - 10); }
    function seekFwd() { music.currentTime = Math.min(music.duration || 99, music.currentTime + 10); }

    function fmt(s) {
        s = Math.floor(s || 0);
        return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
    }

    function initParticles() {
        var c = document.getElementById('particles');
        var ctx = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;

        var pts = Array.from({length:25}, function() {
            return {
                x: Math.random()*c.width,
                y: Math.random()*c.height,
                r: Math.random()*1.2+0.3,
                s: Math.random()*0.35+0.1,
                o: Math.random()*0.3+0.05,
                d: (Math.random()-0.5)*0.25
            };
        });

        function draw() {
            ctx.clearRect(0,0,c.width,c.height);
            pts.forEach(function(p) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,'+p.o+')';
                ctx.fill();
                p.y -= p.s; p.x += p.d;
                if (p.y < -4) { p.y = c.height+4; p.x = Math.random()*c.width; }
            });
            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', function(){ c.width=window.innerWidth; c.height=window.innerHeight; });
    }

    fetchViews();
</script>

</body>
</html>
